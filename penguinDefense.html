<!DOCTYPE html>
<html lang="de">
	<head>

		<script src="./js/towers/SnowballGun.js"></script>
		<script src="./js/towers/IceMage.js"></script>
		<script src="./js/towers/Superpenguin.js"></script>
		<script src="./js/towers/Fisher.js"></script>
		
		<!-- Enemy script and sub-classes -->
		<script src="./js/enemies/Enemy.js"></script>
		<script src="./js/enemies/Snowman.js"></script>

		<script src="./js/Audiohandler.js"></script>
		
		<!-- Mainscript -->
		<script src="./js/penguinDefense.js"></script>

			<canvas id="TOWERS"></canvas>
			<canvas id="ENEMIES"></canvas>

			<img src="./img/level/levelTilesDeco.png" id="TILESET"/>

			<img src="./img/ui/PenguinCard.png" id="PENGUIN_CARD"/>

			<img src="./img/ui/pauseButton.png" id="PAUSE_BUTTON"/>

				https://www.youtube.com/watch?v=DzEZQQR02UI
				https://gamebanana.com/mods/424541 -->

			<audio src="./audio/hit2.mp3" id="HIT2"></audio>	<!-- https://pixabay.com/sound-effects/film-special-effects-wet-plastic-hit-96146/ -->
